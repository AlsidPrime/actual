                    - text: "if you are experiencing bugs relating to split transactions or transfers and the \"Reset budget cache\" button above does not help, this tool may fix them. Some examples of bugs include seeing blank payees on splits or incorrect account balances. This tool does six things:"
                  - list [ref=f2e5762]:
                    - listitem [ref=f2e5763]: Ensures that deleted split transactions are fully deleted. In previous versions of the app, certain split transactions may appear deleted but not all of them are actually deleted. This causes the transactions list to look correct, but certain balances may be incorrect when filtering.
                    - listitem [ref=f2e5764]: Sync the payee and cleared flag of a split transaction to the main or "parent" transaction, if appropriate. The payee will only be set if it currently doesn't have one.
                    - listitem [ref=f2e5765]: Checks that the sum of all child transactions adds up to the total amount. If not, these will be flagged below to allow you to easily locate and fix the amounts.
                    - listitem [ref=f2e5766]: Checks for any non-split transactions with erroneous split errors and removes the errors if found.
                    - listitem [ref=f2e5767]: Check if you have any budget transfers that erroneously contain a category, and remove the category.
                    - listitem [ref=f2e5768]: Checks for any parent transactions with a category and removes the category if found.
                - button "Repair transactions" [ref=f2e5770]
